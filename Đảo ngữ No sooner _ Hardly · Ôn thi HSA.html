<script>

<section class="card reveal"><h2 class="sc"><small>Phần I</small>Lý thuyết trọng tâm</h2>
<p>No sooner và Hardly / Scarcely / Barely diễn tả một sự việc <b>vừa mới xảy ra thì ngay lập tức</b> có sự việc khác tiếp nối. Nghĩa tiếng Việt: “Vừa mới … thì …”.</p>
<h3>1. Công thức đảo ngữ (Inversion)</h3>
<p>Khi các cụm từ này đứng đầu câu để nhấn mạnh, <b>bắt buộc đảo</b> trợ động từ lên trước chủ ngữ ở mệnh đề đầu tiên.</p>
<div class="fm"><b class="k">No sooner</b><b>+ had +</b><b class="w">S</b><b>+ V3/ed</b><b class="k">THAN</b><b class="w">S</b><b>+ V (quá khứ đơn)</b></div>
<div class="fm"><b class="k2">Hardly / Scarcely / Barely</b><b>+ had +</b><b class="w">S</b><b>+ V3/ed</b><b class="k2">WHEN</b><b class="w">S</b><b>+ V (quá khứ đơn)</b></div>
<div class="note"><b>Chú ý siêu quan trọng (bẫy trong đề thi):</b><br>• No sooner LUÔN đi với <b>THAN</b> (vì “sooner” là hình thức so sánh hơn).<br>• Hardly / Scarcely / Barely LUÔN đi với <b>WHEN</b> (đôi khi dùng “before”).<br>• Hành động xảy ra trước chia <b>quá khứ hoàn thành</b>; hành động theo sau chia <b>quá khứ đơn</b>.</div></section>
<section class="card reveal"><h3 style="margin-top:0">2. Cách làm bài viết lại câu</h3>
<p>Đề thường cho câu dùng As soon as (ngay khi), Just after (ngay sau khi), The moment (khoảnh khắc mà)…</p>
<div class="wrap"><table><tr><th>Câu gốc (As soon as / Right after)</th><th>Viết lại (No sooner / Hardly)</th></tr>
<tr><td style="color:inherit;font-weight:400">As soon as he arrived home, the phone rang.</td><td>No sooner had he arrived home than the phone rang.<br>Hardly had he arrived home when the phone rang.</td></tr>
<tr><td style="color:inherit;font-weight:400">She started crying right after she read the letter.</td><td>No sooner had she read the letter than she started crying.</td></tr></table></div>
<h3>Bước giải</h3><ol><li>Xác định hành động 1 (xảy ra trước) và hành động 2 (xảy ra sau).</li><li>Chia hành động 1 ở quá khứ hoàn thành, đẩy “had” lên trước chủ ngữ.</li><li>Đặt liên từ “than” hoặc “when” vào giữa hai mệnh đề.</li><li>Chia hành động 2 ở quá khứ đơn.</li></ol></section>
<section class="card reveal"><h3 style="margin-top:0">3. Khi KHÔNG đảo ngữ</h3>
<p>Nếu No sooner hoặc Hardly không đứng đầu câu, đặt chúng vào giữa câu như trạng từ bình thường (kẹp giữa “had” và động từ chính). Tuy nhiên, trong đề tự luận, cấu trúc đảo ngữ vẫn được ưa chuộng nhất.</p>
<div class="note">He had <b>no sooner</b> arrived <b>than</b> the phone rang. = He had <b>hardly</b> arrived <b>when</b> the phone rang.</div></section>`;

["The plane took off immediately after the bad weather cleared up.","No sooner","No sooner had the bad weather cleared up than the plane took off.","the bad weather cleared up","the plane took off","Hành động sau “immediately after” xảy ra trước."],

let ok=0,done=0;const pc=[0,0],L=["A","B","C","D"],pill=$("pill");
function upd(){pill.textContent=`Đúng ${ok} / ${done}`;if(done===50){$("brk").textContent=`Tự luận: ${pc[0]}/30 · Trắc nghiệm: ${pc[1]}/20`;$("final").textContent=ok+"/50";$("msg").textContent=ok>=45?"Xuất sắc, bạn nắm chắc đảo ngữ No sooner / Hardly.":ok>=35?"Khá tốt. Xem lại những câu sai để chắc hơn.":"Đọc lại phần lý thuyết rồi thử lại nhé."}}
let ctx;
function snd(g){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const n=ctx.currentTime;(g?[[660,0],[880,.12],[1175,.24]]:[[220,0],[165,.17]]).forEach(([f,o])=>{const s=ctx.createOscillator(),v=ctx.createGain();s.type=g?"sine":"sawtooth";s.frequency.value=f;v.gain.setValueAtTime(.0001,n+o);v.gain.exponentialRampToValueAtTime(g?.2:.12,n+o+.02);v.gain.exponentialRampToValueAtTime(.0001,n+o+.3);s.connect(v);v.connect(ctx.destination);s.start(n+o);s.stop(n+o+.32)})}catch(e){}}
function mark(g,p){done++;if(g){ok++;pc[p]++}snd(g);upd()}
const card=(h,sub,t)=>{const s=document.createElement("section");s.className="card reveal";s.innerHTML=`<h2 class="sc"><small>${sub}</small>${h}</h2>${t?`<p class="mut">${t}</p>`:""}`;return s};
const nz=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;]/g,"").replace(/\s+/g," ").trim();
const W=$("work");

const c2=card("Viết lại câu","Phần II · Tự luận · câu 1–30","Viết lại bằng đảo ngữ với từ gợi ý. Gõ tiếp sau từ mở đầu (hoặc cả câu), rồi nhấn Enter.");
E.forEach((e,i)=>{const d=document.createElement("div");d.className="q";
  d.innerHTML=`<div class="sent"><span class="qn">${i+1}</span>${e[0]}</div><div class="row"><span class="st">➔ ${e[1]}</span><textarea aria-label="Câu ${i+1}" placeholder="Viết tiếp…"></textarea><button class="cb">Kiểm tra</button></div><div class="fb"></div>`;
  const ta=d.querySelector("textarea"),bt=d.querySelector(".cb"),fb=d.querySelector(".fb");
  const as=[nz(e[2])];if(e[1]!=="No sooner")as.push(nz(e[2].replace(" when "," before ")));
  const run=()=>{const u=nz(ta.value);if(!u||ta.disabled)return;
    const g=as.includes(nz(e[1]+" "+u))||as.includes(u);
    ta.disabled=bt.disabled=true;ta.classList.add(g?"ok":"no");
    const con=e[1]==="No sooner"?"No sooner luôn đi với <b>than</b>.":"Hardly / Scarcely / Barely đi với <b>when</b> (đôi khi before).";
    fb.className="fb show "+(g?"ok":"no");
    fb.innerHTML=`<strong class="${g?"ok":"no"}">${g?"Chính xác!":"Chưa đúng."}</strong><div class="ans">${e[2]}</div><div class="mut">Trước: <b>${e[3]}</b> → had + V3, đảo had lên trước chủ ngữ. Sau: <b>${e[4]}</b> → quá khứ đơn. ${con} ${e[5]}</div>`;
    mark(g,0)};
  bt.onclick=run;ta.onkeydown=ev=>{if(ev.key==="Enter"&&!ev.shiftKey){ev.preventDefault();run()}};c2.appendChild(d)});
W.appendChild(c2);

for(let g=0;g<2;g++){const c=card("Trắc nghiệm HSA",`Phần III · câu ${g*10+31}–${g*10+40}`,g?"":"Chọn đáp án có nghĩa gần nhất với câu gốc, hoặc đúng ngữ pháp nhất.");
  M.slice(g*10,g*10+10).forEach((m,i)=>{const n=g*10+i+31,d=document.createElement("div");d.className="q";
    d.innerHTML=`<div class="sent"><span class="qn">${n}</span><b>${m[0]}</b></div>${m[1].map((s,j)=>`<button class="opt" data-j="${j}"><span class="l">${L[j]}.</span>${s}</button>`).join("")}<div class="fb"></div>`;
    const bs=[...d.querySelectorAll(".opt")],fb=d.querySelector(".fb");
    bs.forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok2=j===m[2];
      bs.forEach(x=>x.disabled=true);bs[m[2]].classList.add("ok");if(!ok2)b.classList.add("no");
      fb.className="fb show "+(ok2?"ok":"no");
      fb.innerHTML=`<strong class="${ok2?"ok":"no"}">${ok2?"Chính xác!":"Chưa đúng."}</strong> Đáp án đúng: <b>${L[m[2]]}</b><div class="mut">${m[3]}</div>`;
      mark(ok2,1)});
    c.appendChild(d)});W.appendChild(c)}

/* hoa, phong thư và lấp lánh */
function poppy(id,c1,c2,seed){let h=`<defs><radialGradient id="${id}g" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient></defs>`;
  [[100,110,70,58,0],[70,96,52,64,-22],[132,96,52,64,22],[100,76,46,50,0]].forEach(([x,y,rx,ry,r],i)=>h+=`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#${id}g)" opacity="${.9-i*.06}" transform="rotate(${r} ${x} ${y})"/>`);
  for(let i=0;i<9;i++){const a=(-70+i*17)*Math.PI/180;h+=`<line x1="100" y1="100" x2="${100+Math.cos(a)*30}" y2="${100+Math.sin(a)*30}" stroke="#ffd54a" stroke-width="2.2" stroke-linecap="round"/>`}
  $(id).innerHTML=h}
poppy("f1","#ffc2d8","#f06fa6");poppy("f2","#ffb0cc","#ee5c9c");poppy("f3","#ffd0e0","#f58bb8");
[[8,12],[88,8],[12,60],[92,48],[80,76],[20,88],[50,24],[64,90]].forEach(([x,y],i)=>$("sps").insertAdjacentHTML("beforeend",`<svg class="sp" style="left:${x}vw;top:${y}vh;animation-delay:${i*.5}s" viewBox="0 0 24 24"><path d="M12 1C13 8 16 11 23 12 16 13 13 16 12 23 11 16 8 13 1 12 8 11 11 8 12 1z" fill="#fff" stroke="#c9b6f5" stroke-width="1"/></svg>`));
const px=[["f1",.1,.015],["f2",-.08,-.012],["f3",-.12,.02]].map(x=>[$(x[0]),x[1],x[2]]);
addEventListener("scroll",()=>{const y=scrollY;px.forEach(([e,s,r])=>e.style.transform=`translateY(${y*s}px) rotate(${y*r}deg)`)},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.05});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
</script>
